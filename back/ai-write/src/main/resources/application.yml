spring:
  application:
    name: ai-write
  profiles:
    active: ${SPRING_PROFILE:mysql}

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_write?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 20000

  # DDL 由 schema.sql 全权负责（含 MySQL 生成列），Hibernate 不做自动变更
  sql:
    init:
      mode: never
      continue-on-error: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 30
          time_zone: Asia/Shanghai
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

  # SSE 长连接：放宽异步超时
  mvc:
    async:
      request-timeout: 900000

server:
  port: 8080
  tomcat:
    threads:
      max: 80

logging:
  level:
    root: INFO
    com.wjh.aiwrite: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ---------------- 业务配置 ----------------
novel:
  ai:
    # ModelGateway 实现：mock（本地语料，无需联网）/ openai（任意 OpenAI 兼容的大模型接口）
    provider: ${AI_PROVIDER:mock}
    model: ${AI_MODEL:deepseek-chat}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    # API Key 只从环境变量取，禁止写进代码或提交进仓库
    api-key: ${AI_API_KEY:sk-0a54417576434db79f86064e2c25fe3f}
    timeout-seconds: ${AI_TIMEOUT:180}
    max-retry: ${AI_MAX_RETRY:2}

    generation:
      # 单章目标与验收区间（文档 §1.1）
      chapter-target-words: 2500
      chapter-min-words: 2300
      chapter-max-words: 2700
      # 五段计划目标字数：500/550/450/450/550
      segment-targets: 500,550,450,450,550
      # 流式削峰：两次 delta 之间的最小间隔
      stream-interval-ms: 26

    cost:
      # 估算单价（元 / 千 token）。真实账单以厂商为准，文档 §11 要求实测后校准
      input-price-per-k: ${AI_INPUT_PRICE:0.002}
      output-price-per-k: ${AI_OUTPUT_PRICE:0.008}
      month-budget: 100

---
# 无 MySQL 环境时的内存库（集成测试 / 快速验证）
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:ai_write;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
